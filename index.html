<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handbol Alzira · Estadísticas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F318C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Handbol Alzira">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#F1F2EE;--surface:#fff;--ink:#14213D;--mute:#5b6577;--line:#d9dce2;--brand:#2F318C;--club:#AB131A;--rival:#4B5563;--on:#fff;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1424;--surface:#18203A;--ink:#EEF1F8;--mute:#9aa5bd;--line:#2a3452;--brand:#9EA2FF;--club:#FF6B70;--rival:#A3AEC2;--on:#0E1424;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1424;--surface:#18203A;--ink:#EEF1F8;--mute:#9aa5bd;--line:#2a3452;--brand:#9EA2FF;--club:#FF6B70;--rival:#A3AEC2;--on:#0E1424;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px}
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.team{background:var(--surface);border:3px solid transparent;border-radius:10px;padding:8px;text-align:center;cursor:pointer;min-width:0}
.team.sel{border-color:var(--c)}
.team input{width:100%;border:0;background:transparent;color:var(--c);font:700 20px 'Barlow Condensed',sans-serif;text-align:center;padding:2px}
.score{font:700 72px/1 'Barlow Condensed',sans-serif;color:var(--c)}
.mid{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:0 4px}
.clock{font:700 40px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.half{color:var(--mute);font-size:14px}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-height:44px}
button:focus-visible,input:focus-visible{outline:3px solid var(--c,var(--brand));outline-offset:2px}
.primary{background:var(--brand);color:var(--on);border-color:var(--brand);font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin:14px 0 10px;border-bottom:2px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:8px 8px 0 0;background:none;color:var(--mute);font-weight:600}
.tabs button.on{color:var(--ink);box-shadow:inset 0 -3px var(--brand)}
h2{font:700 22px 'Barlow Condensed',sans-serif;margin:14px 0 6px;color:var(--c)}
.chips button{min-width:48px;padding:8px 10px}
.chips button.on{background:var(--c);color:var(--on);border-color:var(--c);font-weight:600}
.add{display:flex;gap:6px;margin:8px 0}
.add input{width:90px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.acts button{min-height:56px;font-weight:600;text-align:left}
.acts .gol{grid-column:1/-1;background:var(--c);color:var(--on);border-color:var(--c);font-size:20px;min-height:68px;text-align:center}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:14px}
td:first-child,th:first-child{text-align:left;padding-left:10px;position:sticky;left:0;background:var(--surface)}
tr.tot td{font-weight:700;border-bottom:0}
.note{color:var(--mute);font-size:14px;margin:6px 0}
.log{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.log li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log .t{font:700 18px 'Barlow Condensed',sans-serif;width:56px;color:var(--mute)}
.log .w{flex:1}
.log button{min-height:36px;padding:4px 10px}
.empty{color:var(--mute);padding:16px;text-align:center}
footer{margin:20px 0 8px;display:flex;justify-content:space-between;gap:8px}
@media (max-width:420px){.score{font-size:56px}.clock{font-size:32px}}
.tabs button{padding:10px 2px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:14px 14px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));max-height:100%;overflow-y:auto}
.goal{width:100%;display:block;border-radius:8px;margin:6px 0 10px;touch-action:manipulation}
.top{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.badge{background:#fff;border-radius:50%;width:56px;height:56px;display:grid;place-items:center;flex:none;box-shadow:0 0 0 2px var(--line)}
.badge img{width:48px;height:48px;object-fit:contain}
.club{font:700 28px/1 'Barlow Condensed',sans-serif;color:var(--brand);text-transform:uppercase;letter-spacing:.02em}
.sub{color:var(--mute);font-size:14px}
.seg{display:flex;gap:6px;align-items:center;margin:0 0 10px;color:var(--mute);font-size:14px}
.seg button{padding:6px 12px;min-height:36px}
.seg button.on{background:var(--club);color:var(--on);border-color:var(--club);font-weight:600}
.chips button{min-width:64px;min-height:64px;padding:4px 10px;font:700 34px/1 'Barlow Condensed',sans-serif}
.chips button.eq{min-width:0;padding:8px 14px;font:600 16px Barlow,system-ui,sans-serif}
.dor{font:700 24px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.fh{display:flex;align-items:center;gap:12px;margin:6px 0}
.fh .big{font:700 64px/1 'Barlow Condensed',sans-serif;color:var(--c)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center}
.tile b{display:block;font:700 30px/1 'Barlow Condensed',sans-serif}
.tile span{font-size:12px;color:var(--mute)}
.chips button small{display:block;font:500 11px/1.1 Barlow,system-ui,sans-serif;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.pn{font:500 14px Barlow,system-ui,sans-serif;color:var(--mute);margin-left:2px}
.chips button.del{border:2px dashed var(--club);position:relative}
.chips button.del::after{content:'✕';position:absolute;top:2px;right:5px;font:700 13px Barlow,sans-serif;color:var(--club)}
body{font-size:19px}
.team input{font-size:22px;text-overflow:ellipsis}
.score{font-size:80px}
.clock{font-size:46px}
.half,.sub,.note,.seg{font-size:16px}
.mid button{font-size:17px;padding:8px 10px}
h2{font-size:27px}
th{font-size:16px}
table{font-size:18px}
.club{font-size:30px}
.dor{font-size:28px}
.chips button{font-size:40px;min-width:72px;min-height:72px}
.chips button.eq{font-size:18px;min-width:0;min-height:48px}
.chips button small{font-size:13px;max-width:80px}
.acts button{font-size:19px}
.acts .gol{font-size:24px;min-height:76px}
.tile b{font-size:36px}
.tile span{font-size:14px}
.fh .big{font-size:76px}
.pn{font-size:17px}
.log .t{font-size:22px;width:64px}
.tabs button{font-size:18px;min-height:48px}
@media (max-width:520px){.board{grid-template-columns:1fr 1fr}.mid{order:3;grid-column:1/-1;flex-direction:row;flex-wrap:wrap;justify-content:center;padding:4px 0}.tabs{display:grid;grid-template-columns:1fr 1fr}}
.chips button{position:relative}
.chips button.ed{border:2px dashed var(--brand)}
.chips button.ed::after{content:'✎';position:absolute;top:2px;right:5px;font:700 14px sans-serif;color:var(--brand)}
.chips button.ed.on{background:var(--brand);color:var(--on)}
.chips button.ed.on::after{color:var(--on)}
.chips button.gk::before{content:'POR';position:absolute;top:3px;left:5px;font:700 11px Barlow,system-ui,sans-serif;opacity:.85;color:inherit}
.mt{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.mt.cur{border-color:var(--brand);border-width:2px}
@media (max-width:520px){.tabs{grid-template-columns:repeat(3,1fr)}.tabs button{font-size:16px}}
.spg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:10px 0 0}
.sph{font:700 16px 'Barlow Condensed',sans-serif;color:var(--c);text-transform:uppercase;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:6px 8px;margin-bottom:6px}
.spr{display:flex;align-items:center;gap:4px;min-width:0}.spr .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0}
.spr .dor{font-size:28px;flex:none}
.spr .cd{margin-left:auto;font:700 28px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;color:var(--c);flex:none}
.spr button{min-height:32px;min-width:32px;padding:0;font-size:14px;flex:none}
.bar{display:block;height:6px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--c)}
.sp.low .cd{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.sp.low .cd{animation:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const ACT=[['gol','Gol','G'],['fallo','Tiro fallado','F'],['parado','Tiro parado','P'],['asist','Asistencia','A'],['perdida','Pérdida','Pé'],['robo','Robo','R'],['dos','Exclusión 2 min',"2'"],['amarilla','Tarjeta amarilla','Am'],['roja','Tarjeta roja','Ro'],['tm','Tiempo muerto','TM']];
const KEY='balonmano-v1', HALF=1800;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let S={names:['Handbol Alzira','Visitante'],ros:[[],[]],ev:[],half:1,secs:0,run:false,team:0,pl:null,tab:'reg',date:today(),pending:null,club:0,fp:null,nm:[{},{}],gk:[null,null],mid:null};
try{const r=localStorage.getItem(KEY);if(r){S=Object.assign(S,JSON.parse(r));S.run=false;S.pending=null;S.ev=S.ev.map(e=>e.type==='parada'?Object.assign({},e,{type:'parado',team:1-e.team,pl:null}):e)}}catch(e){}
let armed=false;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const col=t=>S.club===t?'var(--club)':'var(--rival)';
const cnt=(t,type,p)=>S.ev.filter(e=>e.team===t&&e.type===type&&(p===undefined||e.pl===p)).length;
const label=type=>ACT.find(a=>a[0]===type)[1];
function who(e){return esc(S.names[e.team])+(e.pl!==null?' · '+dn(e.team,e.pl):'')}
function set(o){Object.assign(S,o);save();render()}
function setClub(i){const d=['Local','Visitante'];
 if(S.club!==i){S.ros.reverse();S.nm.reverse();S.gk.reverse();S.names.reverse();S.names=S.names.map((n,k)=>d.includes(n)?d[k]:n);
  S.ev.forEach(e=>e.team=1-e.team);S.team=1-S.team;if(S.fp)S.fp.t=1-S.fp.t}
 S.club=i;save();render()}
function headerHtml(){return '<div class="top"><span class="badge"><img src="icons/escudo.png" alt="Escudo del Handbol Alzira" width="48" height="48"></span><div><div class="club">Handbol Alzira</div><div class="sub">Estadísticas de partido</div></div></div>'
 +'<div class="seg" role="group" aria-label="Nuestro equipo en este partido"><span>Jugamos como</span>'+['Local','Visitante'].map((n,i)=>'<button class="'+(S.club===i?'on':'')+'" aria-pressed="'+(S.club===i)+'" onclick="setClub('+i+')">'+n+'</button>').join('')+'</div>'}
let editing=false,armedR=false,editN=null,editErr='';
function toggleEdit(){editing=!editing;armedR=false;editN=null;editErr='';render()}
function setGK(){const t=S.team;if(S.pl!==null&&S.gk[t]!==S.pl)S.gk[t]=S.pl;else S.gk[t]=null;save();render()}
function gkStats(t,p){const ev=S.ev.filter(e=>e.team===1-t&&(e.type==='gol'||e.type==='parado')&&(e.g??null)===p),par=ev.filter(e=>e.type==='parado').length;return{ev,par,gc:ev.length-par,pct:ev.length?Math.round(100*par/ev.length):null}}
function gkIds(t){const a=new Set(S.ev.filter(e=>e.team===1-t&&(e.type==='gol'||e.type==='parado')).map(e=>e.g??null));if(S.gk[t]!==null)a.add(S.gk[t]);return [...a].sort((x,y)=>(x===null)-(y===null)||x-y)}
function gkTable(t){const ids=gkIds(t);if(!ids.length)return '';
 return '<p class="note" style="margin-top:12px"><b>Porteros de '+esc(S.names[t])+'</b></p><div class="tw"><table><tr><th>Portero</th><th>Paradas</th><th>Goles</th><th>% par.</th></tr>'+ids.map(p=>{const k=gkStats(t,p);return '<tr><td>'+(p===null?'Sin asignar':dn(t,p))+'</td><td>'+k.par+'</td><td>'+k.gc+'</td><td>'+(k.pct===null?'–':k.pct+' %')+'</td></tr>'}).join('')+'</table></div>'}
function gkSec(t,p){const k=gkStats(t,p);if(!k.ev.length&&S.gk[t]!==p)return '';
 const pts=k.ev.filter(e=>e.x!==undefined).map(e=>({x:e.x,y:e.y,type:e.type,c:col(1-t)})),h=Object.assign(heatOf(pts),{col:col(1-t)});
 return '<h2 style="--c:'+col(t)+'">Como portero</h2><div class="tiles" style="grid-template-columns:repeat(3,1fr)">'+[['Paradas',k.par],['Goles enc.',k.gc],['% paradas',k.pct===null?'–':k.pct+' %']].map(x=>'<div class="tile"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('')+'</div><p class="note">Tiros recibidos por zona: goles/tiros. ● gol · ○ parada</p>'+goalSVG(pts,false,h)}
function editSel(n){editN=editN===n?null:n;editErr='';render()}
function delPlayer(n){const t=S.team;S.ros[t]=S.ros[t].filter(x=>x!==n);delete S.nm[t][n];if(S.pl===n)S.pl=null;if(S.gk[t]===n)S.gk[t]=null;if(S.fp&&S.fp.t===t&&S.fp.p===n)S.fp=null;editN=null;save();render()}
function saveEdit(){const t=S.team,o=editN,n=parseInt(document.getElementById('enum').value,10),v=document.getElementById('enm').value.trim();
 if(isNaN(n)||n<0||n>99){editErr='El dorsal debe estar entre 0 y 99.';return render()}
 if(n!==o&&S.ros[t].includes(n)){editErr='El dorsal '+n+' ya existe en este equipo.';return render()}
 S.ros[t]=S.ros[t].map(x=>x===o?n:x).sort((a,b)=>a-b);delete S.nm[t][o];if(v)S.nm[t][n]=v;
 S.ev.forEach(e=>{if(e.team===t&&e.pl===o)e.pl=n;if(e.team===1-t&&e.g===o)e.g=n});
 if(S.pl===o)S.pl=n;if(S.gk[t]===o)S.gk[t]=n;if(S.fp&&S.fp.t===t&&S.fp.p===o)S.fp.p=n;
 editN=null;editErr='';save();render()}
const C={club:'#AB131A',rival:'#4B5563',ink:'#14213D',line:'#d9dce2',surface:'#fff',mute:'#5b6577',brand:'#2F318C',bg:'#f1f2ee'};
const hc=t=>S.club===t?C.club:C.rival;
const plain=s=>s.replace(/var\(--(\w+)\)/g,(m,k)=>C[k]||'#000').replace(/Barlow,sans-serif/g,'Arial,sans-serif');
const gsvg=(pts,heat,x,y,w)=>plain(goalSVG(pts,false,heat)).replace(/<svg class="goal"[^>]*>/,'<svg x="'+x+'" y="'+y+'" width="'+w+'" height="'+w*260/360+'" viewBox="0 0 360 260">');
const X=(x,y,t,z,f,a,b)=>'<text x="'+x+'" y="'+y+'" font-size="'+z+'" fill="'+(f||C.ink)+'"'+(b?' font-weight="700"':'')+(a?' text-anchor="'+a+'"':'')+'>'+esc(t)+'</text>';
const R=(x,y,w,h,f,r)=>'<rect x="'+x+'" y="'+y+'" width="'+Math.max(0,w)+'" height="'+h+'" rx="'+(r||0)+'" fill="'+f+'"/>';
const wrap=(w,h,b)=>'<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" font-family="Arial,Helvetica,sans-serif"><rect width="'+w+'" height="'+h+'" fill="#fff"/>'+b+'</svg>';
const head=(w,lg,sub)=>R(0,0,w,100,C.brand)+'<circle cx="55" cy="50" r="40" fill="#fff"/>'+(lg?'<image href="'+lg+'" x="20" y="15" width="70" height="70"/>':'')+X(110,48,'Handbol Alzira',32,'#fff',0,1)+X(110,80,sub,18,'#fff');
const pls=t=>[...new Set([...S.ros[t],...S.ev.filter(e=>e.team===t&&e.pl!==null).map(e=>e.pl)])].sort((a,b)=>a-b);
const st=(t,p)=>{const n=k=>cnt(t,k,p),g=n('gol'),sh=g+n('fallo')+n('parado');return{g,sh,e:sh?Math.round(100*g/sh):0,a:n('asist'),pe:n('perdida'),r:n('robo'),d:n('dos'),t:n('amarilla')+n('roja')}};
const shots=(t,p)=>S.ev.filter(e=>e.x!==undefined&&e.team===t&&(p===undefined||e.pl===p)&&['gol','fallo','parado'].includes(e.type)).map(e=>({x:e.x,y:e.y,type:e.type,c:hc(t)}));
const tile=(bx,by,w,v,l,c)=>R(bx,by,w,88,C.bg,12)+X(bx+w/2,by+52,String(v),42,c,'middle',1)+X(bx+w/2,by+76,l,15,C.mute,'middle');
function reportSVG(lg){const W=800;let y=100,o=head(W,lg,'Estadísticas de partido · '+S.date);
 [0,1].forEach(t=>{const x=t?600:200;o+=X(x,y+42,S.names[t],26,hc(t),'middle',1)+X(x,y+132,String(cnt(t,'gol')),100,hc(t),'middle',1)});
 o+=X(400,y+120,'–',60,C.mute,'middle');y+=160;
 const A=st(0),B=st(1),rows=[['Lanzamientos',A.sh,B.sh],['Eficacia de lanzamiento %',A.e,B.e,100],['Paradas del portero',cnt(1,'parado'),cnt(0,'parado')],['Asistencias',A.a,B.a],['Pérdidas',A.pe,B.pe],['Robos',A.r,B.r],['Exclusiones 2 min',A.d,B.d],['Tarjetas',A.t,B.t]];
 o+=X(400,y+24,'Comparativa',24,C.ink,'middle',1);y+=44;
 rows.forEach(r=>{const m=r[3]||Math.max(r[1],r[2],1),wl=r[1]/m*270,wr=r[2]/m*270;
  o+=X(400,y+14,r[0],15,C.mute,'middle')+R(330-wl,y+20,wl,14,hc(0),4)+R(470,y+20,wr,14,hc(1),4)+X(324-wl,y+32,String(r[1]),17,C.ink,'end',1)+X(476+wr,y+32,String(r[2]),17,C.ink,'start',1);y+=46});
 y+=10;[0,1].forEach(t=>{const pts=shots(t),h=Object.assign(heatOf(pts),{col:hc(t)}),x=t?410:10;
  o+=X(x+190,y+22,'Lanzamientos de '+S.names[t],18,hc(t),'middle',1)+gsvg(pts,h,x,y+32,380)});
 y+=32+274+22;o+=X(400,y,'● gol   ✕ fallado   ○ parado   ·   en cada zona: goles/lanzamientos (vista del tirador)',13,C.mute,'middle');y+=30;
 [0,1].forEach(t=>{const ps=pls(t);if(!ps.length)return;const mg=Math.max(1,...ps.map(p=>st(t,p).g));

function toggleRun(){S.run=!S.run;save();render()}
function nextHalf(){set({half:S.half===1?2:1,secs:S.half===1?HALF:0,run:false})}
function reset(){if(!armed){armed=true;render();return}armed=false;S.ev=[];S.ros[1-S.club]=[];S.nm[1-S.club]={};S.names[1-S.club]=['Local','Visitante'][1-S.club];S.gk=[null,null];S.secs=0;S.half=1;S.run=false;S.pl=null;S.pending=null;S.fp=null;S.mid=null;S.date=today();save();render()}
function eff(t){const g=cnt(t,'gol'),sh=g+cnt(t,'fallo')+cnt(t,'parado');return sh?Math.round(100*g/sh)+' % ('+g+'/'+sh+')':'sin lanzamientos'}
function table(t){
 const players=[...new Set([...S.ros[t],...S.ev.filter(e=>e.team===t&&e.pl!==null).map(e=>e.pl)])].sort((a,b)=>a-b);
 const cols=ACT.filter(a=>a[0]!=='tm');
 let h='<div class="tw"><table><tr><th>Jugador</th>'+cols.map(a=>'<th title="'+a[1]+'">'+a[2]+'</th>').join('')+'</tr>';
 players.forEach(p=>{h+='<tr><td>'+dn(t,p)+'</td>'+cols.map(a=>'<td>'+cnt(t,a[0],p)+'</td>').join('')+'</tr>'});
 h+='<tr class="tot"><td>Equipo</td>'+cols.map(a=>'<td>'+cnt(t,a[0])+'</td>').join('')+'</tr></table></div>';
 return '<h2 style="--c:'+col(t)+'">'+esc(S.names[t])+'</h2>'+h+'<p class="note">Eficacia de lanzamiento: '+eff(t)+' · Paradas del portero: '+cnt(1-t,'parado')+'</p>'+gkTable(t)+shotMap(t);
}
function render(){arch();
 const t=S.team;
 let h=headerHtml()+'<div class="board">';
 for(const i of [0,1]){
  h+=(i===1?'<div class="mid"><div class="clock" id="clock">'+fmt(S.secs)+'</div><div class="half">'+S.half+'.ª parte</div>'
   +'<button class="primary" onclick="toggleRun()">'+(S.run?'Pausar':'Iniciar')+'</button>'
   +'<button onclick="nextHalf()">'+(S.half===1?'Ir a 2.ª parte':'Volver a 1.ª')+'</button></div>':'')
   +'<div class="team'+(t===i?' sel':'')+'" style="--c:'+col(i)+'" onclick="set({team:'+i+',pl:null})">'
   +'<input aria-label="Nombre del equipo" value="'+esc(S.names[i])+'" onclick="event.stopPropagation()" oninput="S.names[%i]=this.value;save()">'.replace('%i',i)
   +'<div class="score">'+cnt(i,'gol')+'</div></div>';
  if(i===0&&false)h+='';
 }
 h+='</div>';
 h+='<div id="susp">'+suspInner()+'</div>';
 h+='<div class="tabs">'+[['reg','Registrar'],['est','Estadísticas'],['his','Historial'],['par','Partidos'],['exp','Exportar']].map(x=>'<button class="'+(S.tab===x[0]?'on':'')+'" onclick="set({tab:\''+x[0]+'\'})">'+x[1]+'</button>').join('')+'</div>';
 if(S.tab==='reg'){
  h+='<div style="--c:'+col(t)+'"><h2>Registrando: '+esc(S.names[t])+'</h2><div class="row chips">'
   +'<button class="eq '+(S.pl===null?'on':'')+'" onclick="set({pl:null})">Equipo</button>'
   +S.ros[t].map(n=>'<button class="'+(editing?(editN===n?'ed on':'ed'):S.pl===n?'on':'')+(S.gk[t]===n?' gk':'')+'" onclick="'+(editing?'editSel('+n+')':'set({pl:'+n+'})')+'">'+n+(nm(t,n)?'<small>'+esc(nm(t,n))+'</small>':'')+'</button>').join('')+'</div>'
   +'<div class="add"><input id="num" type="number" inputmode="numeric" min="0" max="99" placeholder="Dorsal" onkeydown="if(event.key===\'Enter\')addPlayer()"><input id="pnm" type="text" maxlength="30" placeholder="Nombre (opcional)" style="width:auto;flex:1;min-width:0" onkeydown="if(event.key===\'Enter\')addPlayer()"><button onclick="addPlayer()">Añadir</button></div>'
   +'<p class="note">Portero en pista: <b>'+(S.gk[t]!==null?dn(t,S.gk[t]):'sin marcar')+'</b></p><div class="row" style="margin-bottom:8px"><button onclick="setGK()"'+(S.pl===null&&S.gk[t]===null?' disabled':'')+'>'+(S.pl!==null&&S.gk[t]!==S.pl?'Marcar n.º '+S.pl+' como portero':S.gk[t]!==null?'Quitar portero':'Marcar como portero')+'</button></div>'
 +'<div class="row" style="margin-bottom:6px"><button onclick="toggleEdit()">'+(editing?'Terminar edición':'Editar plantilla')+'</button>'+(editing?'<button onclick="clearRos()">'+(armedR?'Pulsa de nuevo: vaciar '+esc(S.names[t]):'Vaciar plantilla')+'</button>':'')+'</div>'+(editing?'<p class="note">'+(editErr||'Toca un dorsal para cambiar su número o nombre, o quitarlo.')+'</p>'+(editN!==null?'<div class="add"><input id="enum" type="number" inputmode="numeric" min="0" max="99" value="'+editN+'"><input id="enm" type="text" maxlength="30" value="'+esc(nm(t,editN))+'" style="width:auto;flex:1;min-width:0"><button class="primary" onclick="saveEdit()">Guardar</button></div><div class="row"><button onclick="delPlayer('+editN+')">Quitar jugador</button><button onclick="editN=null;render()">Cancelar</button></div>':''):'')
   +'<div class="acts">'+ACT.map(a=>'<button class="'+(a[0]==='gol'?'gol':'')+'" onclick="act(\''+a[0]+'\')">'+a[1]+'</button>').join('')+'</div>'
   +'<div class="row" style="margin-top:10px"><button onclick="undo()"'+(S.ev.length?'':' disabled')+'>Deshacer último</button></div></div>';
 }else if(S.tab==='est'){
  h+='<h2 style="--c:var(--ink)">Ficha de jugador</h2>'+fpChips()+ficha()+table(0)+table(1)+'<p class="note">G gol · F fallado · P parado · A asistencia · Pé pérdida · R robo · 2\' exclusión · Am amarilla · Ro roja. La eficacia es goles entre todos los lanzamientos (gol, fallado y parado).</p>';
 }else if(S.tab==='par'){h+=parHtml()}else if(S.tab==='exp'){h+=expHtml()}else{
  h+=S.ev.length?'<ul class="log">'+S.ev.map((e,i)=>[e,i]).reverse().map(([e,i])=>'<li><span class="t">'+fmt(e.t)+'</span><span class="w" style="color:'+col(e.team)+'"><b>'+label(e.type)+'</b><br><span style="color:var(--mute)">'+who(e)+(zona(e)?' · '+zona(e):'')+' · '+e.h+'.ª parte</span></span><button onclick="del('+i+')" aria-label="Eliminar evento">Borrar</button></li>').join('')+'</ul>'
   :'<div class="empty">Aún no hay eventos. Elige un equipo y pulsa una acción en Registrar.</div>';
 }
 h+='<footer><span class="note">Los datos se guardan en este dispositivo · versión 11</span><button onclick="reset()">'+(armed?'Pulsa de nuevo: se guarda este partido y empieza otro':'Nuevo partido')+'</button></footer>';
  if(S.pending){h+='<div class="modal"><div class="sheet" style="--c:'+col(t)+'"><h2>'+label(S.pending)+' · '+esc(S.names[t])+(S.pl!==null?' · '+dn(t,S.pl):'')+'</h2><p class="note">Toca el punto por donde fue el tiro. Fuera del marco = fuera.</p>'+(S.pending==='gol'||S.pending==='parado'?'<p class="note">Portero rival: <b>'+(S.gk[1-t]!==null?dn(1-t,S.gk[1-t]):'sin marcar')+'</b></p>':'')+goalSVG([],true)+'<div class="row"><button onclick="add(S.pending)">Sin posición</button><button onclick="set({pending:null})">Cancelar</button></div></div></div>'}
 document.getElementById('app').innerHTML=h;
}
setInterval(()=>{if(S.run){S.secs++;const c=document.getElementById('clock');if(c)c.textContent=fmt(S.secs);save();updSusp();if(navigator.vibrate&&S.ev.some(e=>e.type==='dos'&&!e.fin&&S.secs-e.t===SUSP))navigator.vibrate([300,100,300])}},1000);
render();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
